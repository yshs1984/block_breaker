name: Bump version on PR

# PRを開いた時点／PRブランチへのpush時点で、タイトル画面に表示しているバージョン
# （game.js / mobile/game.js の VERSION 定数）をそのPRの番号に合わせて、
# PRブランチ上で直接更新する（マージを待たない）。
# 別リポジトリ shooter の version-bump.yml と同じ方式に揃えている。
on:
  pull_request:
    types: [opened]
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  bump-version:
    # push イベントでは、このワークフロー自身が直前に行ったバージョン更新コミットの push で
    # 再度トリガーされて無限ループにならないよう、pusherがbot自身の場合は除外する。
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.event.pusher.name != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      # pull_request イベントならPR番号はそのまま使える。
      # push イベント（PRを開いた後にさらにコミットを積んだ場合）は、
      # このブランチに紐づくオープンなPRをAPIで探す（無ければ何もしない）。
      - name: Resolve PR number and branch name
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BRANCH="${{ github.event.pull_request.head.ref }}"
          else
            BRANCH="${{ github.ref_name }}"
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # game.js / mobile/game.js のうち、このPRが実際に変更したファイルだけを対象にする
      # （PC版・モバイル版のどちらか一方しか触っていないPRの方が多いため）
      - name: List files changed in this PR
        id: changed
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh pr view "${{ steps.pr.outputs.number }}" --json files -q '.files[].path')
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update VERSION constant
        id: bump
        if: steps.pr.outputs.number != ''
        run: |
          set -e
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          NEW_VERSION="1.0.${PR_NUMBER}"
          UPDATED=0
          while IFS= read -r f; do
            if { [ "$f" = "game.js" ] || [ "$f" = "mobile/game.js" ]; } && [ -f "$f" ] && grep -q 'const VERSION = "' "$f"; then
              sed -i -E "s/const VERSION = \"[0-9]+\.[0-9]+\.[0-9]+\";/const VERSION = \"${NEW_VERSION}\";/" "$f"
              echo "Updated $f -> ${NEW_VERSION}"
              UPDATED=1
            fi
          done <<< "${{ steps.changed.outputs.files }}"
          echo "updated=${UPDATED}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: steps.bump.outputs.updated == '1'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game.js mobile/game.js
          git commit -m "chore: バージョンを ${{ steps.bump.outputs.new_version }} に更新 (PR #${{ steps.pr.outputs.number }})"
          git push origin "HEAD:${{ steps.pr.outputs.branch }}"
